name: Build and release Lumen

# Builds Android, Android TV, Windows, macOS, Linux and an unsigned iOS app.
# The private Google Play bundle stays out of the public GitHub release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# Needed so the release job can publish/update the "latest" release.
permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.9 # matches local dev SDK (Dart 3.10.x)

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_COMMUNITY_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_COMMUNITY_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_COMMUNITY_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_lumenCommunityBuild: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure Community APK signing
        shell: bash
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/community-release.p12
          {
            printf 'storeFile=community-release.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/community-release.p12 android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Verify signed, installable Community APK
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          build_tools_dir="$(dirname "$apksigner")"
          "$build_tools_dir/aapt" dump badging "$apk" | grep "package: name='com.talhaashraf.lumen.community'"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Google Play receives an Android App Bundle signed with the dedicated upload
  # key. The bundle remains a private workflow artifact until it is submitted to
  # the closed-testing track; it is never attached to the public GitHub release.
  android-play:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_PLAY_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_lumenCommunityBuild: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure Google Play upload signing
        shell: bash
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/play-upload.p12
          {
            printf 'storeFile=play-upload.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
          } > android/key.properties
          chmod 600 android/app/play-upload.p12 android/key.properties
      - run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Verify signed Google Play bundle
        shell: bash
        run: |
          bundle="build/app/outputs/bundle/release/app-release.aab"
          jarsigner -verify "$bundle"
          test "$(unzip -p "$bundle" base/manifest/AndroidManifest.xml | strings | grep -o 'com.talhaashraf.lumen' | head -n 1)" = "com.talhaashraf.lumen"
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Google-Play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Package portable zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Lumen-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows
          path: Lumen-Windows.zip
          if-no-files-found: error

  macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Zip .app
        run: |
          APP_PATH="build/macos/Build/Products/Release/Lumen.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Lumen-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-macOS
          path: Lumen-macOS.zip
          if-no-files-found: error

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libmpv-dev mpv libsecret-1-dev libjsoncpp-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Package tarball
        run: tar -czf Lumen-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Linux
          path: Lumen-Linux-x64.tar.gz
          if-no-files-found: error

  ios:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Unsigned build (CI has no signing certs). Produces Runner.app that must
      # be re-signed / sideloaded (e.g. with AltStore or Sideloadly) to install.
      - run: flutter build ios --release --no-codesign --dart-define=APP_BUILD=${{ github.run_number }}
      - name: Zip unsigned .app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Lumen-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-iOS-unsigned
          path: Lumen-iOS-unsigned.zip
          if-no-files-found: error

  # Publish installable packages to the rolling "latest" release. The Google
  # Play AAB remains a private Actions artifact and is intentionally omitted.
  release:
    needs: [android, android-play, windows, macos, linux, ios]
    if: >-
      ${{
        always() &&
        needs.android.result == 'success' &&
        needs.android-play.result == 'success' &&
        needs.windows.result == 'success' &&
        needs.macos.result == 'success' &&
        needs.linux.result == 'success' &&
        needs.ios.result == 'success'
      }}
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Download Android Community artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-Android-apk
          path: dist/android
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-Windows
          path: dist/windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-macOS
          path: dist/macos
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-Linux
          path: dist/linux
      - name: Download unsigned iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Lumen-iOS-unsigned
          path: dist/ios
      - name: Stage release assets (stable names)
        run: |
          mkdir -p out
          cp dist/android/app-release.apk out/Lumen-Android.apk
          cp dist/windows/Lumen-Windows.zip out/Lumen-Windows.zip
          cp dist/macos/Lumen-macOS.zip out/Lumen-macOS.zip
          cp dist/linux/Lumen-Linux-x64.tar.gz out/Lumen-Linux-x64.tar.gz
          cp dist/ios/Lumen-iOS-unsigned.zip out/Lumen-iOS-unsigned.zip
          for asset in out/*; do
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -la out
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          # The app reads this 'build:' line to detect newer builds for in-app update.
          body: |
            build: ${{ github.run_number }}

            Lumen automatic build for Android, Android TV, Windows, macOS,
            Linux and iOS. Install links are below.
            The Android asset is a signed Community build for direct installation
            and uses a separate package from the Google Play edition.
            The iOS asset is unsigned and must be signed before installation.
          # Must NOT be a prerelease, or the /releases/latest/ download URLs 404.
          prerelease: false
          make_latest: true
          files: out/*
      - name: Announce the Android build on Discord
        if: ${{ env.DISCORD_RELEASE_WEBHOOK != '' }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DOWNLOADER_URL: https://aftv.news/4560142
          DOWNLOADER_CODE: "4560142"
        run: |
          if [ ! -f out/Lumen-Android.apk ]; then
            echo "Android artifact is unavailable; skipping Discord announcement."
            exit 0
          fi
          jq -n \
            --arg build "$BUILD_NUMBER" \
            --arg downloader "$DOWNLOADER_URL" \
            --arg downloaderCode "$DOWNLOADER_CODE" \
            '{
              username: "Lumen Releases",
              content: ("**New Lumen build " + $build + " is available**\n\nAndroid and Android TV\nDownloader code: `" + $downloaderCode + "`\nDownload: " + $downloader)
            }' \
            > discord-payload.json
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @discord-payload.json \
            "$DISCORD_RELEASE_WEBHOOK"
